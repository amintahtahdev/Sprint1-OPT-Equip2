<html lang="cat">
<head>
    <meta charset="UTF-8">
    <title>Registre | Montsià30</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/registre.css">
    <script src="/js/include.js" defer></script>
    <link rel="icon" type="image/png" href="/assets/img/favicon.ico">
</head>
<body>
    
    <div class="header-gen">
        <a href="/index.html">
            <img src="/assets/img/logo.png" alt="Logotip Montsià30 - Anar a l'inici">
        </a>
    </div>

    <main class="registre-main">
        <div class="registre-container">
            <h1>Registre</h1>
            <form class="registre-form" id="formRegistre">
                <div class="form-group">
                    <label for="nom" class="registre-label">Nom complet:</label>
                    <input type="text" id="nom" name="nom" class="registre-input" required>
                </div>

                <div class="form-group">
                    <label for="email" class="registre-label">Correu Electrònic:</label>
                    <input type="email" id="email" name="email" class="registre-input" required>
                    <small class="help-text">Ha de ser del domini @montsia30.net</small>
                    <div id="error-email" class="error-message" style="display: none;"></div>
                </div>

                <div class="form-group">
                    <label for="password" class="registre-label">Contrasenya:</label>
                    <input type="password" id="password" name="password" class="registre-input" required>
                    <small class="help-text">Mínim 8 caràcters, majúscules, minúscules i números</small>
                    <div id="error-password" class="error-message" style="display: none;"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="registre-label">Repeteix la contrasenya:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="registre-input" required>
                    <div id="error-confirm" class="error-message" style="display: none;"></div>
                </div>

                <button type="button" onclick="validarFormulari()" class="registre-button">Registra't</button>
            </form>
            
            <div class="registre-links">
                <a href="/pages/login.html">← Tornar a Iniciar Sessió</a>
            </div>
        </div>
    </main>

    <footer>
        <p>Montsià30 | Desenvolupat per Montsílio'n<br>
        Tel: +34 977 000 000 | Correu: info@montsia30.net | Adreça: C/ Exemple, 123. Amposta, Espanya</p>
    </footer>

    <script>
    function validarFormulari() {
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirmPassword').value;
        var valid = true;
        
        // Amagar errors anteriors
        document.querySelectorAll('.error-message').forEach(function(el) {
            el.style.display = 'none';
        });
        
        // Validar email
        var parts = email.split('@');
        if (parts.length !== 2 || parts[1] !== 'montsia30.net') {
            document.getElementById('error-email').textContent = 'ERROR: El correu ha de ser del domini @montsia30.net (exemple: usuari@montsia30.net)';
            document.getElementById('error-email').style.display = 'block';
            valid = false;
        }
        
        // Validar contrasenya - COMPLETA
        var errorsContrasenya = [];
        
        if (password.length < 8) {
            errorsContrasenya.push('mínim 8 caràcters');
        }
        
        if (!/[a-z]/.test(password)) {
            errorsContrasenya.push('almenys una minúscula');
        }
        
        if (!/[A-Z]/.test(password)) {
            errorsContrasenya.push('almenys una majúscula');
        }
        
        if (!/[0-9]/.test(password)) {
            errorsContrasenya.push('almenys un número');
        }
        
        if (errorsContrasenya.length > 0) {
            document.getElementById('error-password').textContent = 'ERROR: La contrasenya ha de tenir: ' + errorsContrasenya.join(', ');
            document.getElementById('error-password').style.display = 'block';
            valid = false;
        }
        
        // Validar que les contrasenyes coincideixin
        if (password !== confirmPassword) {
            document.getElementById('error-confirm').textContent = 'ERROR: Les contrasenyes no coincideixen';
            document.getElementById('error-confirm').style.display = 'block';
            valid = false;
        }
        
        if (valid) {
            alert('Registre completat amb èxit! Ara seràs redirigit a la intranet.');
            // Redirigir a la pàgina de la intranet
            window.location.href = '/pages/intranet.html';
        }
    }
    </script>
</body>
</html>
