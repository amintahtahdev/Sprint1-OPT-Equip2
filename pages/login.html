<html lang="cat">
<head>

    <script src="/js/include.js" defer></script>
    <link rel="icon" type="image/png" href="/assets/icons/favicon.ico">
</head>
<body>
    
    <!-- CAPSALERA -->
    <div class="header-gen">
        <a href="/index.html">
            <img src="/assets/img/logo.png" alt="Logotip Montsià30 - Anar a l'inici">
        </a>
    </div>

    <!-- CONTINGUT PRINCIPAL -->
    <main class="login-main">
        <h1>Iniciar Sessió</h1>

            <input type="password" class="login-input">
        </form>
        <a href="/pages/intranet.html" id="btt_is">Iniciar Sessió</a>
        
        <!-- ENLLAÇ DE REGISTRE AFEGIT -->
        <div class="login-links">
            <a href="/pages/registre.html">No tens compte? Registra't</a>
        </div>
    </main>

    <!-- PEU DE PÀGINA -->
    <footer></footer>
