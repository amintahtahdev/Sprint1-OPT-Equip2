<html lang="cat">
<head>
    <meta charset="UTF-8">

    <!-- Títol de la pàgina -->
    <title>Contactes | Montsià30</title>

    <!-- Full d'estils general compartit per totes les pàgines -->
    <link rel="stylesheet" href="/css/styles.css">

    <!-- Full d'estils específic per a la pàgina de contactes -->
    <link rel="stylesheet" href="/css/digitalitzacio/contactes.css">

    <!-- Script per carregar components comuns (capçalera, peu, etc.) -->
    <script src="/js/include.js" defer></script>

    <!-- Icona que apareix a la pestanya del navegador -->
    <link rel="icon" type="image/png" href="/assets/img/favicon.ico">
</head>
<body>
    
    <!-- =========================
        CAPSALERA GENERAL
        ========================= -->
    <header class="header-gen"></header>

    <!-- =========================
        CONTINGUT PRINCIPAL
        ========================= -->
    <main>

        <!-- Títol principal de la pàgina -->
        <h1>Contacte</h1>

        <!-- Missatge introductori als usuaris -->
        <p>
            Si tens algun dubte, suggeriment o comentari sobre les eines de digitalització, 
            no dubtis en posar-te en contacte amb nosaltres. Completa el formulari a continuació 
            i ens posarem en contacte amb tu el més aviat possible.
        </p>
    
        <!-- Secció principal amb imatge i formulari -->
        <section class="contact-section">

            <!-- Imatge decorativa per a la secció de contacte -->
            <div class="contact-image">
                <img src="/assets/img/contacte.jpg" alt="Imatge de contacte">
            </div>
            
            <!-- Formulari de contacte -->
            <form action="#" method="post">

                <!-- Camp: Nom -->
                <div>
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" required>
                </div>

                <!-- Camp: Correu electrònic -->
                <div>
                    <label for="correu">Correu electrònic</label>
                    <input type="email" id="correu" name="correu" required>
                </div>

                <!-- Camp: Assumpte -->
                <div>
                    <label for="assumpte">Assumpte</label>
                    <input type="text" id="assumpte" name="assumpte" required>
                </div>

                <!-- Camp: Missatge -->
                <div>
                    <label for="missatge">Missatge</label>
                    <textarea id="missatge" name="missatge" rows="5" required></textarea>
                </div>

                <!-- Botó d'enviament del formulari -->
                <button type="submit">Enviar</button>

            </form>
        </section>

    </main>

    <!-- =========================
        PEU DE PÀGINA
        ========================= -->
    <footer></footer>
</body>
</html>
